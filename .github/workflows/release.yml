# Builds the one-file Church Service companion for Windows, Linux (PC + Raspberry Pi) and macOS and
# attaches them to a GitHub Release. Push a tag like v1.0.0 to run it.
name: Release companion

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: church-service-windows-x64.exe }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: church-service-linux-x64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, name: church-service-linux-arm64, linker: aarch64-linux-gnu-gcc, pkg: gcc-aarch64-linux-gnu }
          - { os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf, name: church-service-linux-armv7, linker: arm-linux-gnueabihf-gcc, pkg: gcc-arm-linux-gnueabihf }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: church-service-macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: church-service-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: python tools/build.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: '${{ matrix.target }}' }
      - name: Cross linker
        if: matrix.linker
        run: |
          sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV
      - name: Build
        working-directory: companion
        run: cargo build --release --target ${{ matrix.target }}
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: companion
        run: cargo test --release
      - name: Rename
        shell: bash
        run: |
          src=companion/target/${{ matrix.target }}/release/church-service
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: '${{ matrix.name }}', path: '${{ matrix.name }}' }

  web-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: |
          python tools/build.py
          zip -qr church-service-web-offline.zip index.html display.html stage.html obs.html privacy.html terms.html companion.html feedback.html admin.html manifest.webmanifest sw.js asset-manifest.json css js vendor fonts icons data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: church-service-web-offline.zip, path: church-service-web-offline.zip }

  release:
    needs: [build, web-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body: |
            **Windows:** download `church-service-windows-x64.exe`, double-click it, and Church Service opens in your browser. Run it once with `--install` to add Start-menu and desktop shortcuts.
            **Raspberry Pi / Linux:** `church-service-linux-arm64` (Pi 4/5, 64-bit OS), `church-service-linux-armv7` (older Pi), `church-service-linux-x64` (PC). Make it executable with `chmod +x` and run it.
            **Mac:** `church-service-macos-arm64` (M1 and newer) or `church-service-macos-x64` (Intel).
            `church-service-web-offline.zip` is the web app on its own, for hosting on any web server.
