# Publishes the Selah web app to GitHub Pages on every push to main.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Stamp the offline cache list
        run: python tools/build.py
      - name: Collect the web app
        run: |
          mkdir -p site
          cp -r index.html display.html stage.html manifest.webmanifest sw.js asset-manifest.json css js vendor fonts icons data site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
