<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co https://*.supabase.in; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161c28">
<title>Suggestions – Church Service</title>
<meta name="description" content="Tell us how Church Service, the free church presenter for Seventh-day Adventist churches, can be better.">
<link rel="canonical" href="https://leemcq.github.io/Church_Service/feedback.html">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg:#fbfaf7; --fg:#1d2330; --muted:#5a6475; --line:#d9d6cc; --accent:#2b7f3e; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161c28; --fg:#e9e4d8; --muted:#a3acbd; --line:#36435c; --accent:#46a758; --card:#1d2433; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.8rem; margin: .3em 0 .2em; } .muted { color: var(--muted); } a { color: var(--accent); } nav a { margin-right: 1rem; }
  label { display:block; font-weight: 600; margin: 14px 0 6px; }
  textarea, input, select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .kinds { display:flex; gap: 8px; flex-wrap: wrap; } .kinds label { font-weight: 400; margin: 0; display:flex; gap: 6px; align-items:center; padding: 6px 12px; border:1px solid var(--line); border-radius: 999px; cursor:pointer; }
  .kinds input { width:auto; }
  button { margin-top: 16px; font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  #msg { margin-top: 12px; }
</style>
</head>
<body>
<main>
<nav aria-label="Pages"><a href="./">← Open Church Service</a> <a href="privacy.html">Privacy</a></nav>
<h1>Comments and suggestions</h1>
<p class="muted">How can Church Service be better for your church? Ideas, problems and thanks are all welcome. Every message is read.</p>
<form id="f" novalidate>
  <div class="kinds" role="radiogroup" aria-label="Kind of message">
    <label><input type="radio" name="kind" value="idea" checked> Idea</label>
    <label><input type="radio" name="kind" value="problem"> Something is wrong</label>
    <label><input type="radio" name="kind" value="praise"> Thanks</label>
    <label><input type="radio" name="kind" value="other"> Other</label>
  </div>
  <label for="text">Your message</label>
  <textarea id="text" rows="8" maxlength="4000" required></textarea>
  <div id="emailRow" hidden>
    <label for="email">Your email (optional, if you would like an answer)</label>
    <input id="email" type="email" autocomplete="email">
  </div>
  <p id="how" class="muted" hidden></p>
  <button type="submit">Send</button>
  <p id="msg" role="status"></p>
</form>
</main>
<script type="module" src="js/feedback-main.js"></script>
</body>
</html>
